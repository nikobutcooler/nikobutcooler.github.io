<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Niko</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <!-- ==============================
         HEADER
    =============================== -->

    <header>

        <a href="#" class="logo">Niko</a>

        <nav>
            <a href="#" class="active">Main Page</a>
        </nav>

    </header>


    <!-- ==============================
         HOME
    =============================== -->

    <section class="home">

        <div class="home-img">
            <img src="main.jpg" alt="Niko">
        </div>


        <div class="home-content">

            <h1>
                Hi, It's <span>Niko!</span>
            </h1>


            <h3 class="typing-text">
                <span></span>
            </h3>


            <p>
                Bored People Get Crazy Ideas.
            </p>


            <!-- SOCIALS -->

            <div class="social-icons">

                <a
                    href="github"
                    aria-label="GitHub"
                >
                    <i class="fa-brands fa-github"></i>
                </a>

            </div>


            <!-- HIRE BUTTON -->

            <a
                href="email"
                class="btn"
            >
                Hire me
            </a>

        </div>


        <!-- ==============================
             SCROLL DOWN
        =============================== -->

        <a
            href="#calendar"
            class="scroll-down"
        >

            <span>
                SCROLL DOWN
            </span>

            <i class="fa-solid fa-chevron-down"></i>

        </a>

    </section>


    <!-- ==============================
         CALENDAR
    =============================== -->

    <section
        class="calendar-section"
        id="calendar"
    >

        <div class="calendar-header">

            <h2>
                My <span>Calendar</span>
            </h2>

            <p>
                Check my availability and schedule a meeting.
            </p>

        </div>


        <div class="calendar">

            <!-- CALENDAR HEADER -->

            <div class="calendar-top">

                <div class="calendar-title">

                    <h3>
                        Availability
                    </h3>

                    <span>
                        Europe / Amsterdam
                    </span>

                </div>


                <div class="calendar-status">

                    <span></span>

                    Available

                </div>

            </div>


            <!-- GOOGLE CALENDAR -->

            <div class="calendar-frame">

                <iframe
                    src="https://calendar.google.com/calendar/embed?src=149a85f6ba852b319886a43e6353422af8e94b79077515bdbb19c2bb87d4b33e%40group.calendar.google.com&ctz=Europe%2FAmsterdam&bgcolor=%23050505"
                    frameborder="0"
                    scrolling="no">
                </iframe>

            </div>

        </div>

    </section>


</body>

</html>
